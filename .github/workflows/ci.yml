name: CI

# Every push and pull request: the dependencies install, every module compiles and imports, the test suite passes on
# Windows, Linux and macOS, and the website builds with no broken links between the guides.
#
# GitHub's machines have no GPU. Linux runs the whole suite under Xvfb with Mesa's software OpenGL; on Windows and
# macOS the 3D view's OpenGL crashes without a GPU, so the three tests that draw it are left out there.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libportaudio2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pygerber markdown==3.9

      - name: Compile every module
        run: python -m compileall -q pcbpro tools tests

      - name: Import the app
        run: python -c "import pcbpro.app, pcbpro.ui.main_window, pcbpro.sim.realtime, pcbpro.amp.designer; print('ok')"

      - name: Tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -p no:cacheprovider --durations=15

      - name: Tests (Windows and macOS, without the 3D view)
        if: runner.os != 'Linux'
        run: >
          python -m pytest -q -p no:cacheprovider --durations=15
          --deselect tests/test_pedal.py::test_pedal_ui
          --deselect tests/test_ui.py::test_example_3d_and_order_pages
          --deselect tests/test_sim_ui.py::test_3d_view_has_glowing_leds

      - name: Website builds
        if: runner.os == 'Linux'
        run: python tools/build_site.py --check
