name: CI

# Every push and pull request: the dependencies install, every module compiles and imports, the test suite passes on
# Windows, Linux and macOS, and the website builds with no broken links between the guides.
#
# GitHub's machines have no GPU. The tests that open the 3D view need OpenGL 3.3: on Windows, Mesa's software OpenGL
# (the opengl32sw.dll that ships with Qt) is put next to python.exe as opengl32.dll, so Qt and PyOpenGL both use it;
# Linux runs under Xvfb with Mesa's llvmpipe.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libportaudio2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pygerber markdown==3.9

      - name: Software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = python -c "import sys, os; print(os.path.dirname(sys.executable))"
          $sw = python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'opengl32sw.dll'))"
          Copy-Item $sw (Join-Path $py 'opengl32.dll')

      - name: Compile every module
        run: python -m compileall -q pcbpro tools tests

      - name: Import the app
        run: python -c "import pcbpro.app, pcbpro.ui.main_window, pcbpro.sim.realtime, pcbpro.amp.designer; print('ok')"

      - name: Tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -p no:cacheprovider --durations=15

      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest -q -p no:cacheprovider --durations=15

      - name: Website builds
        if: runner.os == 'Linux'
        run: python tools/build_site.py --check
